services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./long_term_memory:/qdrant/storage
    restart: unless-stopped
  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_TOKEN_PATH=/app/secrets/google_token.json
      - TIMEZONE=Europe/Berlin
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=None
      - QDRANT_HOST=localhost
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
    volumes:
      - ./short_term_memory:/app/data
      # Persist the sentence-transformers embedding model (~470MB) so it is not
      # re-downloaded from HuggingFace on every rebuild.
      - hf_cache:/root/.cache/huggingface
      - ./secrets:/app/secrets:ro
    depends_on:
      - qdrant
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=None
      - QDRANT_HOST=localhost
      - QDRANT_URL=http://qdrant:6333
      - GOOGLE_TOKEN_PATH=/app/secrets/google_token.json
      - TIMEZONE=Europe/Berlin
    restart: unless-stopped
    volumes:
      - ./short_term_memory:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant

volumes:
  hf_cache:
